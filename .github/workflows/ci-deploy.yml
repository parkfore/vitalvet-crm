# 테스트 + 배포용 묶음 만들기
# - PR / main 푸시: PHP 테스트, 타입 검사, 화면 빌드
# - main 푸시 성공 시: vendor + public/build 를 포함한 실행 가능한 코드를 `deploy` 브랜치에 올림
#   → 클라우드웨이즈는 `deploy` 브랜치를 Pull 하면 됨 (서버에서 composer/npm 실행 불필요)
# - 저장소 Secrets 에 SERVER_HOST · SERVER_USER · SERVER_SSH_KEY 가 있으면 서버에 접속해 자동 반영
#   (deploy 묶음 복사 → migrate → optimize:clear). 없으면 이 단계는 건너뛴다.
name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 운영(Supabase)과 같은 PostgreSQL로 테스트한다
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitalvet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: vitalvet_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Migrate (PostgreSQL)
        run: |
          php artisan migrate --force
          php artisan db:show

      - name: Tests
        shell: bash
        run: |
          set +e
          php artisan test --colors=never 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 실패 내용을 PR 화면(요약·주석)에 바로 보이게 한다
            { echo '## 테스트 실패'; echo '```'; tail -n 80 test-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            grep -nE 'FAILED|Error|Exception|Failed asserting' test-output.txt | head -20 | while IFS= read -r line; do echo "::error title=Test::$line"; done
          fi
          exit $code

  deploy:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build production bundle
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress
          npm ci
          npm run build

      - name: Push to deploy branch
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads "$REPO_URL" deploy >/dev/null; then
            git clone --depth 1 --branch deploy "$REPO_URL" ../deploy
          else
            mkdir ../deploy && git -C ../deploy init -b deploy && git -C ../deploy remote add origin "$REPO_URL"
          fi

          rsync -a --delete \
            --exclude .git --exclude node_modules --exclude .env --exclude tests --exclude .github \
            ./ ../deploy/

          # 배포 브랜치에는 vendor 와 빌드 결과를 포함한다
          sed -i -e '/^\/vendor$/d' -e '/^\/public\/build$/d' ../deploy/.gitignore

          cd ../deploy
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -q -m "deploy: ${GITHUB_SHA::7} $(printf '%s' "$COMMIT_MSG" | head -n1)"
          git push origin deploy

      - name: Apply on server (자동 반영)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          APP_PATH: ${{ secrets.SERVER_APP_PATH }}
        run: |
          set -e
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "::notice title=자동 반영 안 함::저장소 Secrets(SERVER_HOST, SERVER_USER, SERVER_SSH_KEY)가 없어 서버 반영을 건너뜁니다. 서버에서 deploy 브랜치를 Pull 하세요."
            exit 0
          fi
          APP_PATH="${APP_PATH:-applications/hfgsehzzyq/public_html}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i $HOME/.ssh/deploy_key -p ${SERVER_PORT:-22} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          # 클라우드웨이즈 Git 배포는 .git 을 다른 곳에 두므로, 빌드된 deploy 묶음을 그대로 복사한다
          # 서버에만 있는 것(.env, storage, bootstrap/cache, public/storage 등)은 지우거나 덮지 않는다
          rsync -az --delete --no-owner --no-group --chmod=Dug+rwx,Fug+rw -e "$SSH" \
            --exclude .git --filter='P /.*' \
            --filter='P /.env' --filter='P /.env.*' --filter='P /storage/' --filter='P /bootstrap/cache/' \
            --filter='P /public/storage' --filter='P /.user.ini' --filter='P /public/.user.ini' --filter='P /.well-known/' --filter='P /public/.well-known/' \
            "$GITHUB_WORKSPACE/../deploy/" "$SERVER_USER@$SERVER_HOST:$APP_PATH/"
          $SSH "$SERVER_USER@$SERVER_HOST" bash -s <<REMOTE
          set -e
          cd ~/$APP_PATH
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php bootstrap/cache/config.php bootstrap/cache/routes-v7.php
          php artisan migrate --force
          php artisan optimize:clear
          echo "서버 반영 완료: ${GITHUB_SHA::7}"
          REMOTE
          rm -f ~/.ssh/deploy_key
